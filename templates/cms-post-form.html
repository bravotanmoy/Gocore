{{ template "dashboard_top" . }}

<div class="main-content-container overflow-hidden">
	<div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
		<h3 class="mb-0">{{ .title }}</h3>
		<a href="/dashboard/cms/posts" class="btn btn-outline-secondary py-2 px-3">Back to Posts</a>
	</div>

	{{ if .flash }}<div class="alert alert-info">{{ .flash }}</div>{{ end }}

	<form method="post" action="{{ if .isEdit }}/dashboard/cms/posts/{{ .post.ID }}{{ else }}/dashboard/cms/posts{{ end }}">
		<div class="row">
			<div class="col-lg-8">
				<div class="card bg-white border-0 rounded-3 mb-4">
					<div class="card-body p-4">
						<div class="form-group mb-4">
							<label class="label text-secondary mb-1">Title *</label>
							<input type="text" name="title" class="form-control" required value="{{ .post.Title }}" placeholder="Post title" />
						</div>
						<div class="form-group mb-4">
							<label class="label text-secondary mb-1">Excerpt</label>
							<input type="text" name="excerpt" class="form-control" value="{{ .post.Excerpt }}" placeholder="Short summary shown in lists" />
						</div>
						<div class="form-group mb-0">
							<label class="label text-secondary mb-1">Body (HTML or Markdown — your frontend decides)</label>
							<textarea name="body" class="form-control" rows="14" placeholder="Write your content...">{{ .post.Body }}</textarea>
						</div>
					</div>
				</div>

				<div class="card bg-white border-0 rounded-3 mb-4">
					<div class="card-body p-4">
						<h5 class="fs-16 mb-3">SEO</h5>
						<div class="row">
							<div class="col-md-6">
								<div class="form-group mb-4">
									<label class="label text-secondary mb-1">Meta Title</label>
									<input type="text" name="meta_title" class="form-control" value="{{ .post.MetaTitle }}" />
								</div>
							</div>
							<div class="col-md-6">
								<div class="form-group mb-4">
									<label class="label text-secondary mb-1">Meta Description</label>
									<input type="text" name="meta_description" class="form-control" value="{{ .post.MetaDesc }}" />
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>

			<div class="col-lg-4">
				<div class="card bg-white border-0 rounded-3 mb-4">
					<div class="card-body p-4">
						<div class="form-group mb-4">
							<label class="label text-secondary mb-1">Status</label>
							<select name="status" class="form-select form-control">
								<option value="draft" {{ if eq .post.Status "draft" }}selected{{ end }}>Draft</option>
								{{ if .canPublish }}
								<option value="published" {{ if eq .post.Status "published" }}selected{{ end }}>Published</option>
								{{ end }}
								<option value="archived" {{ if eq .post.Status "archived" }}selected{{ end }}>Archived</option>
							</select>
							{{ if not .canPublish }}
							<span class="fs-12 text-body">You don't have the content.publish permission.</span>
							{{ end }}
						</div>
						<div class="form-group mb-4">
							<label class="label text-secondary mb-1">Category</label>
							<select name="category_id" class="form-select form-control">
								<option value="">— none —</option>
								{{ $cid := .post.CategoryID }}
								{{ range .categories }}
								<option value="{{ .ID }}" {{ if $cid }}{{ if eq .ID (deref $cid) }}selected{{ end }}{{ end }}>{{ .Name }}</option>
								{{ end }}
							</select>
						</div>
						<div class="form-group mb-4">
							<label class="label text-secondary mb-1">Tags (comma separated)</label>
							<input type="text" name="tags" class="form-control" value="{{ .tags }}" placeholder="news, golang, cms" />
						</div>
						<div class="form-group mb-4">
							<label class="label text-secondary mb-1">Featured Image URL</label>
							<input type="text" name="featured_image" class="form-control" value="{{ .post.FeaturedImage }}" placeholder="/uploads/2026/09/image.png" />
							<span class="fs-12 text-body">Upload files in the <a href="/dashboard/cms/media">Media Library</a>, then paste the path.</span>
						</div>
						<button type="submit" class="btn btn-primary w-100 py-2">Save Post</button>
					</div>
				</div>
			</div>
		</div>
	</form>
</div>

{{ template "dashboard_bottom" . }}
