{{ template "dashboard_top" . }}

<div class="main-content-container overflow-hidden">
	<div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
		<h3 class="mb-0">Site Settings</h3>
	</div>

	{{ if .flash }}<div class="alert alert-info">{{ .flash }}</div>{{ end }}

	<form method="post" action="/dashboard/cms/settings">
		<div class="row">
			{{ range $group, $settings := .groups }}
			<div class="col-lg-6">
				<div class="card bg-white border-0 rounded-3 mb-4">
					<div class="card-body p-4">
						<h5 class="fs-16 mb-3 text-capitalize">{{ $group }}</h5>
						{{ range $settings }}
						<div class="form-group mb-3">
							<label class="label text-secondary mb-1">{{ .Key }}</label>
							<input type="text" name="set_{{ .Key }}" class="form-control" value="{{ .Value }}" />
						</div>
						{{ end }}
					</div>
				</div>
			</div>
			{{ end }}
		</div>
		<button type="submit" class="btn btn-primary py-2 px-4 mb-4">Save Settings</button>
	</form>
</div>

{{ template "dashboard_bottom" . }}
